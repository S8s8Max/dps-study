---
# Stage 2 メッセージングスタック
# Mosquitto (MQTT) + NATS

services:
  mosquitto:
    image: eclipse-mosquitto:2.0.22
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
    deploy:
      resources:
        limits:
          memory: 64m

  nats:
    image: nats:2.15.0-alpine
    container_name: nats
    restart: unless-stopped
    ports:
      - "4222:4222"    # クライアント接続
      - "8222:8222"    # HTTP モニタリング
    command: ["--http_port", "8222"]
    deploy:
      resources:
        limits:
          memory: 64m

volumes:
  mosquitto_data:
