---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nats
  namespace: dps-study
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nats
  template:
    metadata:
      labels:
        app: nats
    spec:
      containers:
        - name: nats
          image: nats:2.15.0-alpine
          ports:
            - containerPort: 4222   # クライアント
            - containerPort: 8222   # 管理 HTTP

          livenessProbe:
            tcpSocket:
              port: 4222
            initialDelaySeconds: 10
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /healthz
              port: 8222
            initialDelaySeconds: 5
            periodSeconds: 5

          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "64Mi"
              cpu: "200m"

---
# クラスター内部からは nats-service:4222 でアクセス
apiVersion: v1
kind: Service
metadata:
  name: nats-service
  namespace: dps-study
spec:
  selector:
    app: nats
  ports:
    - name: client
      port: 4222
      targetPort: 4222
    - name: monitor
      port: 8222
      targetPort: 8222
  type: ClusterIP

---
# Pi の外（Mac など）からテストするための NodePort
apiVersion: v1
kind: Service
metadata:
  name: nats-nodeport
  namespace: dps-study
spec:
  selector:
    app: nats
  ports:
    - name: client
      port: 4222
      targetPort: 4222
      nodePort: 30222
  type: NodePort
