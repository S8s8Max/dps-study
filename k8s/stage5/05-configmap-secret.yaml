---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pipeline-config
  namespace: dps-study
data:
  NATS_URL: "nats://nats-service:4222"
  WINDOW_SEC: "5"
  LOG_LEVEL: "INFO"
  ANOMALY_SIGMA: "2.5"

---
# Secret の値は base64 エンコードが必要
# echo -n 'changeme' | base64  →  Y2hhbmdlbWU=
# 本番: kubectl create secret generic ... --from-literal= を使う
# このファイルは .gitignore に追加すること
apiVersion: v1
kind: Secret
metadata:
  name: pipeline-secret
  namespace: dps-study
type: Opaque
data:
  # "changeme" の base64
  GRAFANA_ADMIN_PASSWORD: Y2hhbmdlbWU=
