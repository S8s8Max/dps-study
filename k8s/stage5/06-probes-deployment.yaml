apiVersion: apps/v1
kind: Deployment
metadata:
  name: health-server
  namespace: dps-study
spec:
  replicas: 2
  selector:
    matchLabels:
      app: health-server
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: health-server
    spec:
      containers:
        - name: server
          image: health-server:latest
          imagePullPolicy: Never   # ローカルイメージを使う（k3s ctr images import 済み）
          ports:
            - containerPort: 8080

          # 起動直後は受け付けられない → readiness probe が通るまで Service から除外
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3

          # デッドロックや無限ループを検知 → 再起動
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3

          resources:
            requests:
              memory: "32Mi"
              cpu: "100m"
            limits:
              memory: "64Mi"
              cpu: "200m"

---
apiVersion: v1
kind: Service
metadata:
  name: health-server-svc
  namespace: dps-study
spec:
  selector:
    app: health-server
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30081
  type: NodePort
