---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pipeline-worker
  namespace: dps-study
spec:
  replicas: 3
  selector:
    matchLabels:
      app: pipeline-worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1   # 更新中も 2 Pod は常に動き続ける
      maxSurge: 1
  template:
    metadata:
      labels:
        app: pipeline-worker
    spec:
      containers:
        - name: worker
          image: pipeline-worker:latest
          imagePullPolicy: Never   # k3s ctr images import でインポート済み

          # ConfigMap から環境変数を注入
          envFrom:
            - configMapRef:
                name: pipeline-config

          # ヘルスチェック用 HTTP サーバーを内蔵している前提
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 15
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3

          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "500m"
