---
# common ロール: パッケージ・タイムゾーン・chrony・SSH 設定

- name: apt キャッシュを更新する
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: 共通パッケージをインストールする
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present

- name: タイムゾーンを設定する
  community.general.timezone:
    name: "{{ timezone }}"
  notify: タイムゾーン変更後の再起動

- name: chrony をインストールする
  ansible.builtin.apt:
    name: chrony
    state: present

- name: systemd-timesyncd を無効化する（chrony と競合するため）
  ansible.builtin.systemd:
    name: systemd-timesyncd
    state: stopped
    enabled: false
  ignore_errors: true   # すでに無効化されていてもエラーにしない

- name: chrony の設定ファイルを配置する
  ansible.builtin.template:
    src: chrony.conf.j2
    dest: /etc/chrony/chrony.conf
    owner: root
    group: root
    mode: "0644"
  notify: chrony を再起動する

- name: chrony を起動・自動起動有効にする
  ansible.builtin.systemd:
    name: chrony
    state: started
    enabled: true

- name: SSH サーバーの設定を変更する（パスワード認証を無効化）
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?PasswordAuthentication"
    line: "PasswordAuthentication {{ sshd_password_authentication }}"
    state: present
    validate: /usr/sbin/sshd -t -f %s
  notify: SSH サービスを再起動する

- name: SSH サーバーの設定を変更する（root ログインを禁止）
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?PermitRootLogin"
    line: "PermitRootLogin {{ sshd_permit_root_login }}"
    state: present
    validate: /usr/sbin/sshd -t -f %s
  notify: SSH サービスを再起動する
